# This is a basic workflow to help you get started with Actions

name: CI-CD

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    #git add  .github/workflows/main.yml && git commit -m " try solve Error: Error: Input required and not supplied: kubeconfig update value of K8S_KUBECONFIG " && git push new_portfolio_first_for_dev_ops_after_for_all_remote for_new_portfolio_first_for_dev_ops_after_for_all_branch
    branches: ["for_new_portfolio_first_for_dev_ops_after_for_all_branch"] #branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  CI:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      # taking the code to the runs-on(ubuntu-latest
      - uses: actions/checkout@v3
      - name: Autenticando o usuario no Docker #Docker Login
        uses: docker/login-action@v2.0.0
        with:
          # Username used to log against the Docker registry
          # https://github.com/cabicho/kube-news/settings/secrets/actions/new
          username: ${{secrets.DOCKERHUB_USER}}
          # Password or personal access token used to log against the Docker registry
          password: ${{secrets.DOCKERHUB_PWD}}
          # Specifies whether the given registry is ECR (auto, true or false)
      - name: Construindo a imagem e enviando para o Docker Hub #Build and push Docker images
        uses: docker/build-push-action@v3.0.0
        with:
          file: ./src/Dockerfile
          context: ./src
          push: true
          tags: | # como vamos especificar mais de uma
            cabicho/kube-news:latest
            cabicho/kube-news:${{github.run_number}}
  CD:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    needs: [CI]
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Install Linode CLI
        run: |
          # Add commands to install the Linode CLI on the runner
          # Example (you might need to adapt this):
          curl -s https://raw.githubusercontent.com/linode/cli/main/scripts/install | bash
          
      - name: Configure Linode CLI
        run: |
          # Set the Linode API token as an environment variable
          export LINODE_TOKEN="${{ secrets.LINODE_API_TOKEN }}"
          #  Might need to configure the CLI.  This depends on how you installed.
          # linode-cli configure --token "$LINODE_API_TOKEN" #<-- DON'T DO THIS.  The 'configure' command is interactive.
          echo "LINODE_TOKEN is set"

      - name: Get LKE Kubeconfig
        id: get_kubeconfig
        run: |
          # Get the kubeconfig, using the environment variable
          KUBECONFIG_RAW=$(linode-cli lke kubeconfig-view ${{ secrets.LINODE_CLUSTER_ID }} --text)

          # Check for errors
          if [ $? -ne 0 ]; then
            echo "::error::Failed to get LKE kubeconfig"
            exit 1
          fi
          
          # Echo the output
          echo "KUBECONFIG=$KUBECONFIG_RAW" >> $GITHUB_OUTPUT

      - name: Set Kubernetes Context
        uses: Azure/k8s-set-context@v2 #  You might be able to use a Kubernetes action.
        with:
          kubeconfig: ${{ steps.get_kubeconfig.outputs.KUBECONFIG }}
    #steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      # taking the code to the runs-on(ubuntu-latest)
